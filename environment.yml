# Rebuild with: conda env create -f environment.yml
# Record exact versions after it works: conda env export --no-builds > environment.lock.yml
name: uris_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - matplotlib
  - scipy
  - pip
  - pip:
      - pandapower
      - torch
      - plotly
      - scikit-learn
